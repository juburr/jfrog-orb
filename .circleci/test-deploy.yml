version: 2.1
orbs:
  orb-tools: circleci/orb-tools@12.3
  jfrog-orb: {}

filters: &filters
  tags:
    only: /.*/

release-filters: &release-filters
  branches:
    ignore: /.*/
  tags:
    only: /^v[0-9]+\.[0-9]+\.[0-9]+$/

jobs:
  command-test:
    docker:
      - image: cimg/base:current
    environment:
      # Later jf steps in this job are not the configure command, so they would
      # otherwise call api.github.com and print a new-version warning.
      JFROG_CLI_AVOID_NEW_VERSION_WARNING: "true"
    steps:
      - checkout
      - jfrog-orb/install
      - run:
          name: Verify Install
          command: |
            command -v jf
            # Bytes 18-19 of an ELF header are e_machine: 3e 00 is x86-64, b7 00 is aarch64.
            test "$(od -An -tx1 -j18 -N2 "$(command -v jf)" | tr -d ' \n')" = "3e00"
            jf --version
      # Token mode does not contact JFrog. Ping is covered by test/ping_test.sh:
      # a live ping needs an Artifactory that can answer, and a dead host can hang.
      - jfrog-orb/configure:
          url: https://example.jfrog.io
          access_token: orb-configure-test-token
      - run:
          name: Verify configure saved a server profile
          command: |
            set -euo pipefail
            # Do not pipe jf into grep -q. grep -q exits at the first match, jf
            # is killed with SIGPIPE, and pipefail turns that into exit 141.
            show="$(jf config show jfrog-server)"
            grep -Eq '^Server ID:[[:space:]]+jfrog-server[[:space:]]*$' \<<< "$show"
            grep -Eq '^JFrog Platform URL:[[:space:]]+https://example\.jfrog\.io/' \<<< "$show"
            grep -Eq '^Access token:[[:space:]]+\*\*\*[[:space:]]*$' \<<< "$show"
            grep -q 'JFROG_CLI_SERVER_ID=jfrog-server' "$BASH_ENV"
            if grep -qF orb-configure-test-token \<<< "$show"; then
              echo "configure left the access token visible in jf config show"
              exit 1
            fi
      - jfrog-orb/configure:
          server_id: second-server
          url: https://other.example.jfrog.io
          access_token: orb-configure-test-token-2
          use: false
      - run:
          name: Verify a second server does not replace the default
          command: |
            set -euo pipefail
            show_first="$(jf config show jfrog-server)"
            show_second="$(jf config show second-server)"
            grep -Eq '^Default:[[:space:]]+true[[:space:]]*$' \<<< "$show_first"
            grep -Eq '^Default:[[:space:]]+false[[:space:]]*$' \<<< "$show_second"
            if grep -q second-server "$BASH_ENV"; then
              echo "use: false wrote the second server id into BASH_ENV"
              exit 1
            fi
      - jfrog-orb/install:
          version: "2.70.0"
      - jfrog-orb/configure:
          url: https://example.jfrog.io
          user: ci
          access_token: orb-configure-test-token
      - run:
          name: Verify configure against jf 2.70.0
          command: |
            set -euo pipefail
            version="$(jf --version)"
            grep -F "2.70.0" \<<< "$version"
            show="$(jf config show jfrog-server)"
            grep -Eq '^Access token:[[:space:]]+\*\*\*[[:space:]]*$' \<<< "$show"
            grep -Eq '^User:[[:space:]]+ci[[:space:]]*$' \<<< "$show"

  # Test install command on an arm64 machine: the arm64 asset, its checksum and an
  # architecture-specific cache key. Running jf alone wouldn't prove the architecture
  # if the image emulates amd64, so the ELF header is checked too.
  command-test-arm64:
    machine:
      image: ubuntu-2404:current
    resource_class: arm.medium
    environment:
      # Later jf steps in this job are not the configure command, so they would
      # otherwise call api.github.com and print a new-version warning.
      JFROG_CLI_AVOID_NEW_VERSION_WARNING: "true"
    steps:
      # install creates install_path and adds it to the PATH of later steps,
      # so the machine executor needs no preparation for it.
      - run:
          name: Check the machine architecture
          command: |
            echo "uname -m: $(uname -m)"
            test "$(uname -m)" = "aarch64"
      - jfrog-orb/install
      - run:
          name: Verify the arm64 build of jf was installed
          command: |
            test "$(od -An -tx1 -j18 -N2 "$(command -v jf)" | tr -d ' \n')" = "b700"
            jf --version
      - jfrog-orb/configure:
          url: https://example.jfrog.io
          access_token: orb-configure-test-token
      - run:
          name: Verify configure on arm64
          command: |
            set -euo pipefail
            # Do not pipe jf into grep -q. grep -q exits at the first match, jf
            # is killed with SIGPIPE, and pipefail turns that into exit 141.
            show="$(jf config show jfrog-server)"
            grep -Eq '^Access token:[[:space:]]+\*\*\*[[:space:]]*$' \<<< "$show"
            grep -q 'JFROG_CLI_SERVER_ID=jfrog-server' "$BASH_ENV"
      - jfrog-orb/install:
          version: "2.70.0"
      - run:
          name: Verify the arm64 build of the oldest listed jf version was installed
          command: |
            test "$(od -An -tx1 -j18 -N2 "$(command -v jf)" | tr -d ' \n')" = "b700"
            version="$(jf --version)"
            grep -F "2.70.0" \<<< "$version"
      - jfrog-orb/configure:
          url: https://example.jfrog.io
          access_token: orb-configure-test-token
      - run:
          name: Verify configure against jf 2.70.0 on arm64
          command: |
            set -euo pipefail
            show="$(jf config show jfrog-server)"
            grep -Eq '^Access token:[[:space:]]+\*\*\*[[:space:]]*$' \<<< "$show"

workflows:
  test-deploy:
    jobs:
      - command-test:
          filters: *filters
      - command-test-arm64:
          filters: *filters
      - orb-tools/pack:
          filters: *release-filters
      - orb-tools/publish:
          orb_name: juburr/jfrog-orb
          vcs_type: << pipeline.project.type >>
          pub_type: production
          requires:
            - orb-tools/pack
            - command-test
            - command-test-arm64
          context: orb-publishing
          filters: *release-filters
