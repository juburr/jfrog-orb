version: 2.1
setup: true
orbs:
  orb-tools: circleci/orb-tools@12.5
  shellcheck: circleci/shellcheck@3.4

filters: &filters
  tags:
    only: /.*/

jobs:
  test-install:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: Run install contract tests
          command: bash test/install_test.sh
      - run:
          name: Run configure command tests
          command: bash test/configure_test.sh
      - run:
          name: Run ping command tests
          command: bash test/ping_test.sh
      - run:
          name: Run circleci env subst tests
          command: bash test/env_subst_test.sh
      - run:
          name: Run shell convention tests
          command: bash test/shell_conventions_test.sh

workflows:
  lint-pack:
    jobs:
      - test-install:
          filters: *filters
      - orb-tools/lint:
          filters: *filters
      - orb-tools/pack:
          filters: *filters
      - orb-tools/review:
          orb_name: jfrog-orb
          filters: *filters
      - shellcheck/check:
          filters: *filters
      - orb-tools/continue:
          pipeline_number: << pipeline.number >>
          vcs_type: << pipeline.project.type >>
          orb_name: jfrog-orb
          requires: [test-install, orb-tools/lint, orb-tools/pack, orb-tools/review, shellcheck/check]
          filters: *filters
