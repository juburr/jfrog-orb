description: >
  The `install` command is used to simplify installation of the JFrog CLI tool, jf.

usage:
  version: 2.1
  orbs:
    jfrog: juburr/jfrog-orb@0.1.0
  jobs:
    jfrog-sbom:
      docker:
        - image: cimg/base:current-22.04
      steps:
        - jfrog/install

  workflows:
    use-my-orb:
      jobs:
        - jfrog-sbom
