description: >
  Install a pinned jf, configure a server from JF_URL and the access token in JF_ACCESS_TOKEN,
  and ping Artifactory. Store both variables in a context. To read the token from another
  variable, pass that variable's name, for example access_token: JF_DEPLOY_TOKEN.

usage:
  version: 2.1
  orbs:
    jfrog-orb: juburr/jfrog-orb@1.1.0
  jobs:
    jfrog-cli:
      docker:
        - image: cimg/base:current-22.04
      steps:
        - jfrog-orb/install
        - jfrog-orb/configure
        - jfrog-orb/ping

  workflows:
    use-my-orb:
      jobs:
        - jfrog-cli:
            context: jfrog
