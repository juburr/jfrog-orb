description: >
  Pings Artifactory with jf rt ping. The server id is this command's server_id when set,
  otherwise JFROG_CLI_SERVER_ID from configure, otherwise the default server. Run install
  and configure first. A successful ping means the Artifactory URL answered. It does not
  prove permission to a repository, and an anonymous Artifactory returns OK for a wrong
  token. This step does not call api.github.com to check for a newer jf.
parameters:
  server_id:
    type: string
    default: ""
    description: >
      Server id to ping. Leave empty to use JFROG_CLI_SERVER_ID, or the default
      server when that variable is unset. Expanded with circleci env subst.
  insecure_tls:
    type: boolean
    default: false
    description: >
      Pass --insecure-tls to jf rt ping. This does not change the saved server profile.
steps:
  - run:
      name: Ping Artifactory
      environment:
        PARAM_SERVER_ID: << parameters.server_id >>
        PARAM_INSECURE_TLS: << parameters.insecure_tls >>
      shell: /bin/bash
      command: << include(scripts/ping.sh) >>
