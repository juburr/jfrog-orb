description: >
  Adds one JFrog server profile with jf config add, for later jf commands in the same job.
  Run install first. url defaults to ${JF_URL}. access_token, username, and password are the
  names of environment variables, JF_ACCESS_TOKEN, JF_USER, and JF_PASSWORD by default. The
  access token or password is passed on stdin. The command fails when the URL or credentials
  are missing, or when both a token and a password are set, because jf config add exits 0 even
  if it stores an empty token. Password encryption is off unless encrypt_password is true.
  This step does not call api.github.com to check for a newer jf.
parameters:
  server_id:
    type: string
    default: jfrog-server
    description: >
      Server id to write. Later commands use it as the default when set_default is true.
      jf reserves the ids delete, use, show, and clear.
  url:
    type: string
    default: "${JF_URL}"
    description: >
      JFrog Platform URL passed to --url, for example https://acme.jfrog.io.
      This is not the Artifactory URL with an /artifactory suffix. The value is
      expanded with circleci env subst. At least one of url and artifactory_url is required.
  artifactory_url:
    type: string
    default: ""
    description: >
      Artifactory URL for a server that does not share one platform URL, such as
      Artifactory 6. Prefer url for a JFrog Platform. Expanded with circleci env subst.
  access_token:
    type: env_var_name
    default: JF_ACCESS_TOKEN
    description: >
      Name of the environment variable that holds the access token (a reference token
      works too). The token is passed to jf on stdin. The username is also stored when
      the variable named by username is set. Do not set this variable together with the
      one named by password.
  username:
    type: env_var_name
    default: JF_USER
    description: >
      Name of the environment variable that holds the username. Optional next to an
      access token, required with a password. A reference token used by npm or Maven
      basic auth needs a username.
  password:
    type: env_var_name
    default: JF_PASSWORD
    description: >
      Name of the environment variable that holds the password or API key, passed to jf
      on stdin. Requires a username. Do not set this variable together with the one named
      by access_token.
  overwrite:
    type: boolean
    default: true
    description: >
      Replace an existing profile with the same server id. A rerun on a machine
      executor with a persisted home directory then updates the token instead of failing.
  insecure_tls:
    type: boolean
    default: false
    description: >
      Pass --insecure-tls while saving this profile. jf uses it when encrypting a
      password and does not apply it to later commands. ping has its own insecure_tls.
  encrypt_password:
    type: boolean
    default: false
    description: >
      Ask Artifactory to encrypt the password before saving it. This calls the
      platform and sends the password there. Leave this false unless url points
      at a JFrog Platform you trust. Access tokens are unaffected.
  set_default:
    type: boolean
    default: true
    description: >
      Make this server the default: run jf config use for this server id, and export
      JFROG_CLI_SERVER_ID (set to the server id) to $BASH_ENV for later steps in the job.
      Set false when adding another server that should not become the default. jf still
      marks the first server it saves as the default.
steps:
  - run:
      name: Configure jf
      environment:
        PARAM_SERVER_ID: << parameters.server_id >>
        PARAM_URL: << parameters.url >>
        PARAM_ARTIFACTORY_URL: << parameters.artifactory_url >>
        PARAM_ACCESS_TOKEN: << parameters.access_token >>
        PARAM_USERNAME: << parameters.username >>
        PARAM_PASSWORD: << parameters.password >>
        PARAM_OVERWRITE: << parameters.overwrite >>
        PARAM_INSECURE_TLS: << parameters.insecure_tls >>
        PARAM_ENCRYPT_PASSWORD: << parameters.encrypt_password >>
        PARAM_SET_DEFAULT: << parameters.set_default >>
      shell: /bin/bash
      command: << include(scripts/configure.sh) >>
