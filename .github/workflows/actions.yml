# Tests the GitHub Actions in actions/ on GitHub's own runners, as
# .circleci/test-deploy.yml tests the orb's commands on CircleCI. Each job
# runs the actions from this checkout (uses: ./actions/...), so a pull
# request tests its own changes.
name: GitHub Actions

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  # Steps other than configure and ping would otherwise call api.github.com
  # and print a new-version warning.
  JFROG_CLI_AVOID_NEW_VERSION_WARNING: "true"

jobs:
  offline-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the offline tests
        run: |
          for test in test/actions_test.sh test/install_test.sh test/configure_test.sh test/ping_test.sh test/env_subst_test.sh test/shell_conventions_test.sh; do
            echo "=== ${test}"
            bash "${test}"
          done

  install:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Bytes 18-19 of an ELF header are e_machine: 3e 00 is x86-64,
          # b7 00 is aarch64.
          - runner: ubuntu-24.04
            e_machine: "3e00"
          - runner: ubuntu-24.04-arm
            e_machine: "b700"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./actions/install
      - name: Verify the install
        env:
          E_MACHINE: ${{ matrix.e_machine }}
        run: |
          version=$(grep -A3 '^  version:' src/commands/install.yml | sed -n 's/^    default: "\(.*\)"$/\1/p')
          [[ "$(command -v jf)" == "${HOME}/bin/jf" ]]
          [[ "$(od -An -tx1 -j18 -N2 "$(command -v jf)" | tr -d ' \n')" == "${E_MACHINE}" ]]
          jf --version | tee "${RUNNER_TEMP}/version.log"
          grep -F "${version}" "${RUNNER_TEMP}/version.log"
      # The first install saved the release to the cache, so this one
      # restores it. It goes to a directory of its own, which later steps
      # find first on the PATH.
      - uses: ./actions/install
        with:
          install_path: ${{ runner.temp }}/second
      - name: Verify the second install comes first on the PATH
        env:
          SECOND: ${{ runner.temp }}/second
        run: |
          [[ "$(command -v jf)" == "${SECOND}/jf" ]]
          jf --version
      - name: Install an unlisted version, which must fail
        id: unlisted
        continue-on-error: true
        uses: ./actions/install
        with:
          version: 0.0.1
          caching: false
          install_path: ${{ runner.temp }}/unlisted
      - name: Verify it failed before installing anything
        env:
          OUTCOME: ${{ steps.unlisted.outcome }}
          UNLISTED: ${{ runner.temp }}/unlisted
        run: |
          [[ "${OUTCOME}" == failure ]]
          [[ ! -e "${UNLISTED}/jf" ]]

  # A fresh runner with the release's download host blocked installs from
  # the cache the install job saved, which only works if the cache is used.
  install-from-cache:
    needs: install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Block the download host
        run: |
          echo "127.0.0.1 releases.jfrog.io" | sudo tee -a /etc/hosts
          if curl -sSf --max-time 10 -o /dev/null https://releases.jfrog.io; then
            echo "releases.jfrog.io is still reachable."
            exit 1
          fi
      - uses: ./actions/install
      - name: Verify the install
        run: |
          version=$(grep -A3 '^  version:' src/commands/install.yml | sed -n 's/^    default: "\(.*\)"$/\1/p')
          jf --version | grep -F "${version}"

  # test-deploy.yml's command-test, plus url's default read from JF_URL and
  # pings of a local stand-in for Artifactory's ping endpoint, on both
  # architectures.
  configure:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    env:
      # Placeholder credentials. configure names these variables; with a
      # token it does not contact JFrog.
      ORB_TEST_JF_TOKEN: orb-configure-test-token
      ORB_TEST_JF_TOKEN_2: orb-configure-test-token-2
      ORB_TEST_JF_USER: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./actions/install
      - uses: ./actions/configure
        with:
          url: https://example.jfrog.io
          access_token: ORB_TEST_JF_TOKEN
      - name: Verify configure saved a server profile
        run: |
          # Do not pipe jf into grep -q. grep -q exits at the first match, jf
          # is killed with SIGPIPE, and pipefail turns that into exit 141.
          show="$(jf config show jfrog-server)"
          grep -Eq '^Server ID:[[:space:]]+jfrog-server[[:space:]]*$' <<< "$show"
          grep -Eq '^JFrog Platform URL:[[:space:]]+https://example\.jfrog\.io/' <<< "$show"
          grep -Eq '^Access token:[[:space:]]+\*\*\*[[:space:]]*$' <<< "$show"
          [[ "${JFROG_CLI_SERVER_ID}" == jfrog-server ]]
          if grep -qF orb-configure-test-token <<< "$show"; then
            echo "configure left the access token visible in jf config show"
            exit 1
          fi
      - uses: ./actions/configure
        with:
          server_id: second-server
          url: https://other.example.jfrog.io
          access_token: ORB_TEST_JF_TOKEN_2
          set_default: false
      - name: Verify a second server does not replace the default
        run: |
          show_first="$(jf config show jfrog-server)"
          show_second="$(jf config show second-server)"
          grep -Eq '^Default:[[:space:]]+true[[:space:]]*$' <<< "$show_first"
          grep -Eq '^Default:[[:space:]]+false[[:space:]]*$' <<< "$show_second"
          [[ "${JFROG_CLI_SERVER_ID}" == jfrog-server ]]
      # url's default, ${JF_URL}, comes from the step's environment without
      # the CircleCI CLI, as the credentials do.
      - uses: ./actions/configure
        env:
          JF_URL: https://from-env.example.jfrog.io
          JF_ACCESS_TOKEN: orb-configure-test-token-3
        with:
          server_id: from-env
          set_default: false
      - name: Verify url's default read JF_URL
        run: |
          show="$(jf config show from-env)"
          grep -Eq '^JFrog Platform URL:[[:space:]]+https://from-env\.example\.jfrog\.io/' <<< "$show"
          grep -Eq '^Access token:[[:space:]]+\*\*\*[[:space:]]*$' <<< "$show"
      - name: Configure without a URL, which must fail
        id: no-url
        continue-on-error: true
        uses: ./actions/configure
        with:
          server_id: no-url
          access_token: ORB_TEST_JF_TOKEN
          set_default: false
      - name: Verify configure failed without a URL
        env:
          OUTCOME: ${{ steps.no-url.outcome }}
        run: |
          [[ "${OUTCOME}" == failure ]]
          if jf config show no-url > /dev/null 2>&1; then
            echo "configure saved a server without a URL"
            exit 1
          fi
      # jf rt ping asks <Artifactory URL>/api/system/ping for "OK".
      - name: Serve a stand-in for Artifactory's ping endpoint
        run: |
          root="${RUNNER_TEMP}/artifactory-stand-in"
          mkdir -p "${root}/artifactory/api/system"
          printf 'OK' > "${root}/artifactory/api/system/ping"
          nohup python3 -m http.server 8081 --bind 127.0.0.1 --directory "${root}" > "${RUNNER_TEMP}/http.log" 2>&1 &
          for _ in $(seq 1 30); do
            if curl -sSf -o /dev/null http://127.0.0.1:8081/artifactory/api/system/ping; then
              exit 0
            fi
            sleep 1
          done
          echo "The stand-in did not start."
          cat "${RUNNER_TEMP}/http.log"
          exit 1
      - uses: ./actions/configure
        with:
          server_id: local
          url: http://127.0.0.1:8081
          access_token: ORB_TEST_JF_TOKEN
      - uses: ./actions/ping
      - uses: ./actions/ping
        with:
          server_id: local
      - name: Verify both pings reached the stand-in
        run: |
          [[ "${JFROG_CLI_SERVER_ID}" == local ]]
          cat "${RUNNER_TEMP}/http.log"
          # One request is the readiness check above.
          pings=$(grep -c '"GET /artifactory/api/system/ping HTTP/1.1" 200' "${RUNNER_TEMP}/http.log" || true)
          [[ "${pings}" -ge 3 ]]
      # Nothing listens on port 9, so the connection is refused at once.
      - uses: ./actions/configure
        with:
          server_id: dead
          url: http://127.0.0.1:9
          access_token: ORB_TEST_JF_TOKEN
          set_default: false
      - name: Ping a server that doesn't answer, which must fail
        id: dead
        continue-on-error: true
        uses: ./actions/ping
        with:
          server_id: dead
      - name: Verify ping failed
        env:
          OUTCOME: ${{ steps.dead.outcome }}
        run: '[[ "${OUTCOME}" == failure ]]'
      - uses: ./actions/install
        with:
          version: "2.70.0"
      - uses: ./actions/configure
        with:
          url: https://example.jfrog.io
          username: ORB_TEST_JF_USER
          access_token: ORB_TEST_JF_TOKEN
      - name: Verify configure against jf 2.70.0
        run: |
          version="$(jf --version)"
          grep -F "2.70.0" <<< "$version"
          show="$(jf config show jfrog-server)"
          grep -Eq '^Access token:[[:space:]]+\*\*\*[[:space:]]*$' <<< "$show"
          grep -Eq '^User:[[:space:]]+ci[[:space:]]*$' <<< "$show"
          [[ "${JFROG_CLI_SERVER_ID}" == jfrog-server ]]
